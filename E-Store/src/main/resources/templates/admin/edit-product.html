
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Product | E-STORE</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light min-vh-100 d-flex flex-column">

    <!-- Navbar -->
    <nav class="navbar navbar-dark px-3 px-md-4 py-3"
         style="background-color: #131921;">

        <div class="container-fluid">
        
			<a class="navbar-brand fw-bold fs-4" th:href="@{/admin/admindash}"> E-<span
				class="text-warning">STORE</span>
				</a>
				
			<a th:href="@{/admin/admindash}" class="btn btn-secondary mb-3">
				Dashboard 
			</a>


        </div>
    </nav>

    <!-- Main Container -->
    <main class="container flex-grow-1 my-4 my-md-5">

        <div class="row justify-content-center">

            <div class="col-12 col-md-9 col-lg-7 col-xl-6">

                <!-- Edit Product Card -->
                <div class="card border-0 shadow rounded-3">

                    <div class="card-body p-3 p-md-5">

                        <!-- Heading -->
                        <div class="text-center mb-4">

                            <h2 class="fw-bold text-dark mb-2">
                                Edit Product
                            </h2>

                            <p class="text-secondary mb-0">
                                Update your product information.
                            </p>

                        </div>

                        <!-- Edit Product Form -->
                        <form th:action="@{/admin/update-product}"
                              method="post">

                            <!-- Hidden Product ID -->
                            <input type="hidden"
                                   name="id"
                                   th:value="${product.id}">

                            <!-- Product Name -->
                            <div class="mb-4">

                                <label for="name"
                                       class="form-label fw-semibold">
                                    Product Name
                                </label>

                                <input type="text"
                                       id="name"
                                       name="name"
                                       th:value="${product.name}"
                                       class="form-control form-control-lg"
                                       placeholder="Enter product name"
                                       required>

                            </div>

                            <!-- Product Price -->
                            <div class="mb-4">

                                <label for="price"
                                       class="form-label fw-semibold">
                                    Product Price (₹)
                                </label>

                                <input type="number"
                                       id="price"
                                       name="price"
                                       th:value="${product.price}"
                                       step="0.01"
                                       min="0"
                                       class="form-control form-control-lg"
                                       placeholder="Enter product price"
                                       required>

                            </div>

                            <!-- Buttons -->
                            <div class="d-grid gap-3">

                                <button type="submit"
                                        class="btn btn-warning btn-lg rounded-pill fw-semibold">

                                    Update Product

                                </button>

                                <a th:href="@{/admin/product-list}"
                                   class="btn btn-outline-secondary btn-lg rounded-pill">

                                    Cancel

                                </a>

                            </div>

                        </form>

                    </div>

                </div>

                <!-- Back Link -->
                <div class="text-center mt-3">

                    <a th:href="@{/admin/product-list}"
                       class="text-decoration-none text-secondary">

                        ← Back to Product List

                    </a>

                </div>

            </div>

        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center text-white py-3 mt-auto"
            style="background-color: #131921;">

        <p class="mb-0 small">

            © 2026
            <span class="text-warning fw-bold">E-STORE</span>
            | Admin Dashboard | All Rights Reserved.

        </p>

    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
