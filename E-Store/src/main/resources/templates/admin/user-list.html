
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>E-Store - User List</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <style>
        body {
            background: #eaeded;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navbar */
        .navbar {
            background: #131921;
            padding: 15px 30px;
        }

        .navbar-brand {
            color: white !important;
            font-size: 26px;
            font-weight: bold;
        }

        .navbar-brand span {
            color: #ff9900;
        }

        .nav-link {
            color: white !important;
            font-weight: 600;
        }

        .nav-link:hover {
            color: #ff9900 !important;
        }

        .logout-btn {
            background: #ff9900;
            color: #131921 !important;
            padding: 9px 18px;
            border-radius: 6px;
        }

        /* Main */
        .main-content {
            flex: 1;
            padding: 40px 15px;
        }

        .page-title {
            color: #131921;
            font-weight: bold;
        }

        .page-subtitle {
            color: #565959;
        }

        /* Table card */
        .table-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            border: 1px solid #ddd;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .table thead {
            background: #131921;
            color: white;
        }

        .table thead th {
            background: #232f3e;
            color: white;
            padding: 15px;
            white-space: nowrap;
        }

        .table tbody td {
            padding: 14px;
            vertical-align: middle;
        }

        .table tbody tr:hover {
            background: #fff8ed;
        }

        /* Search */
        .search-box {
            max-width: 350px;
        }

        .search-box input {
            border-radius: 6px 0 0 6px;
        }

        .search-box button {
            background: #ff9900;
            border: none;
            color: #131921;
            border-radius: 0 6px 6px 0;
        }

        /* Buttons */
        .btn-view {
            background: #ff9900;
            color: #131921;
            border: none;
            font-weight: 600;
        }

        .btn-view:hover {
            background: #f3a847;
        }

        .btn-delete {
            background: #dc3545;
            color: white;
            border: none;
        }

        .btn-delete:hover {
            background: #bb2d3b;
            color: white;
        }

        .role-badge {
            background: #e7f1ff;
            color: #0d6efd;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-badge {
            background: #d1e7dd;
            color: #146c43;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .user-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #fff0d9;
            color: #e47911;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            margin-right: 8px;
        }

        /* Footer */
        footer {
            background: #131921;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 30px;
        }

        footer span {
            color: #ff9900;
            font-weight: bold;
        }

        @media(max-width: 768px) {
            .navbar {
                padding: 12px 15px;
            }

            .table-card {
                padding: 12px;
            }

            .main-content {
                padding: 25px 10px;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">

        <div class="container-fluid">

            <a class="navbar-brand" th:href="@{/admin/admindash}">
                E-<span>STORE</span>
            </a>

            <button class="navbar-toggler bg-light"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#adminNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="adminNavbar">

                <ul class="navbar-nav ms-auto align-items-lg-center">

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/admindash}">
                            <i class="bi bi-house"></i> Dashboard
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/product-list}">
                            <i class="bi bi-box-seam"></i> Products
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/order-list}">
                            <i class="bi bi-cart-check"></i> Orders
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/user-list}">
                            <i class="bi bi-people"></i> Users
                        </a>
                    </li>

                    <li class="nav-item ms-lg-3">
                        <a class="nav-link logout-btn" th:href="@{/logout}">
                            <i class="bi bi-box-arrow-right"></i> Logout
                        </a>
                    </li>

                </ul>
            </div>
        </div>
    </nav>


    <!-- Main Content -->
    <main class="main-content">

        <div class="container-fluid">

            <div class="d-flex flex-wrap justify-content-between
                        align-items-center mb-4 gap-3">

                <div>
                    <h2 class="page-title">
                        <i class="bi bi-people-fill"></i>
                        User Management
                    </h2>

                    <p class="page-subtitle mb-0">
                        View and manage registered customers.
                    </p>
                </div>

                <a th:href="@{/admin/admindash}" class="btn btn-dark">
                    <i class="bi bi-arrow-left"></i> Dashboard
                </a>

            </div>


            <!-- User Table -->
            <div class="table-card">

                <div class="d-flex flex-wrap justify-content-between
                            align-items-center mb-4 gap-3">

                    <h5 class="fw-bold mb-0">
                        Registered Users
                    </h5>

                    <div class="input-group search-box">

                        <input type="text"
                               id="searchInput"
                               class="form-control"
                               placeholder="Search name or email...">

                        <button class="btn" type="button">
                            <i class="bi bi-search"></i>
                        </button>

                    </div>

                </div>


                <div class="table-responsive">

                    <table class="table table-bordered table-hover align-middle"
                           id="userTable">

                        <thead>
                            <tr>
                                <th>User ID</th>
                                <th>Customer</th>
                                <th>Email Address</th>
                                <th>Role</th>
                                <th>Status</th>
                                <th class="text-center">Actions</th>
                            </tr>
                        </thead>

                        <tbody>

                            <tr th:each="user : ${users}">

                                <td th:text="${user.id}"></td>

                                <td>
                                    <span class="user-avatar">
                                        <i class="bi bi-person-fill"></i>
                                    </span>

                                    <strong th:text="${user.name}"></strong>
                                </td>

                                <td th:text="${user.email}"></td>

                                <td>
                                    <span class="role-badge"
                                          th:text="${user.role}">
                                    </span>
                                </td>

                                <td>
                                    <span class="status-badge">
                                        Active
                                    </span>
                                </td>

                                <td class="text-center">
                                    <form th:action="@{/admin/delete-user/{id}(id=${user.id})}"
                                          method="post"
                                          class="d-inline"
                                          onsubmit="return confirm('Are you sure you want to delete this user?');">

                                        <button type="submit"
                                                class="btn btn-sm btn-delete">
                                            <i class="bi bi-trash"></i> Delete
                                        </button>

                                    </form>

                                </td>

                            </tr>

                            <tr th:if="${#lists.isEmpty(users)}">
                                <td colspan="6" class="text-center py-4">
                                    <i class="bi bi-people fs-1 text-secondary"></i>
                                    <p class="mb-0 mt-2">
                                        No registered users found.
                                    </p>
                                </td>
                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </main>


    <!-- Footer -->
    <footer>

        <p class="mb-0">
            © 2026 <span>E-STORE</span> |
            User Management | All Rights Reserved.
        </p>

    </footer>


    <!-- Search Script -->
    <script>
        document.getElementById("searchInput").addEventListener("keyup", function () {

            let searchValue = this.value.toLowerCase();

            let rows = document.querySelectorAll("#userTable tbody tr");

            rows.forEach(function (row) {

                let rowText = row.innerText.toLowerCase();

                row.style.display = rowText.includes(searchValue) ? "" : "none";

            });

        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
