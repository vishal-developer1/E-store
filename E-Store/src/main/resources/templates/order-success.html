
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Success - E-STORE</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #eaeded;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }

        .navbar {
            background: #131921;
        }

        .navbar-brand {
            font-size: 25px;
            font-weight: 800;
        }

        .success-card {
            max-width: 750px;
            margin: auto;
            border: none;
            border-radius: 18px;
            animation: slideUp 0.8s ease;
        }

        .success-icon {
            width: 95px;
            height: 95px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #198754;
            color: white;
            border-radius: 50%;
            font-size: 55px;
            margin: 0 auto 20px;
            animation: pop 0.7s ease 0.3s both;
        }

        .success-title {
            color: #198754;
            font-weight: 800;
            animation: fadeIn 1s ease;
        }

        .status-box {
            background: #fff3cd;
            border: 1px solid #ffdf80;
            border-radius: 12px;
        }

        .status-text {
            color: #b45309;
            font-weight: 700;
        }

        .shop-btn {
            background: #ffd814;
            border: 1px solid #fcd200;
            color: #111;
            font-weight: 700;
            transition: 0.3s;
        }

        .shop-btn:hover {
            background: #f7ca00;
            border-color: #f2c200;
            color: #111;
            transform: translateY(-3px);
            box-shadow: 0 5px 12px rgba(0, 0, 0, 0.15);
        }

        .success-footer {
            color: #565959;
        }

        .confetti {
            position: fixed;
            top: -15px;
            width: 10px;
            height: 15px;
            z-index: 10;
            pointer-events: none;
            animation: fall 3.5s linear infinite;
        }

        .confetti:nth-child(1) {
            left: 10%;
            background: #ffb703;
            animation-delay: 0s;
        }

        .confetti:nth-child(2) {
            left: 25%;
            background: #2196f3;
            animation-delay: 0.8s;
        }

        .confetti:nth-child(3) {
            left: 40%;
            background: #22c55e;
            animation-delay: 1.4s;
        }

        .confetti:nth-child(4) {
            left: 60%;
            background: #f97316;
            animation-delay: 0.4s;
        }

        .confetti:nth-child(5) {
            left: 75%;
            background: #a855f7;
            animation-delay: 1s;
        }

        .confetti:nth-child(6) {
            left: 90%;
            background: #ef4444;
            animation-delay: 1.8s;
        }

        @keyframes fall {
            0% {
                transform: translateY(-20px) rotate(0deg);
                opacity: 1;
            }

            100% {
                transform: translateY(110vh) rotate(720deg);
                opacity: 0;
            }
        }

        @keyframes pop {
            0% {
                transform: scale(0);
            }

            70% {
                transform: scale(1.15);
            }

            100% {
                transform: scale(1);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(35px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @media (max-width: 576px) {
            .success-card {
                padding: 25px 15px !important;
            }

            .success-title {
                font-size: 25px;
            }

            .success-icon {
                width: 75px;
                height: 75px;
                font-size: 42px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>

    <!-- Animated Confetti -->
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>

    <!-- Navbar -->
    <nav class="navbar navbar-dark py-3">
        <div class="container">

            <a class="navbar-brand text-white text-decoration-none"
               th:href="@{/customer/home}">
                E-<span class="text-warning">STORE</span>
            </a>

            <a th:href="@{/cart}"
               class="btn btn-outline-light rounded-pill px-3 btn-sm">

                <i class="bi bi-cart3 me-1"></i>
                My Cart

            </a>

        </div>
    </nav>

    <!-- Success Section -->
    <main class="container my-4 my-md-5">

        <div class="card success-card shadow-lg p-4 p-md-5 text-center">

            <!-- Success Icon -->
            <div class="success-icon">
                <i class="bi bi-check-lg"></i>
            </div>

            <!-- Success Message -->
            <h1 class="success-title mb-3">
                Order Successfully!
            </h1>

            <h6 class="text-dark mb-4">
                Thank you for shopping with
                <span class="fw-bold text-warning">E-STORE</span>
            </h6>

            <!-- Continue Shopping -->
            <a th:href="@{/customer/home}"
               class="btn shop-btn rounded-pill px-4 py-2">

                <i class="bi bi-shop me-2"></i>
                Continue Shopping

            </a>

        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3 mt-5">

        <div class="container">

            <small class="text-white-50">
                © 2026 E-STORE. All Rights Reserved.
            </small>

        </div>

    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
