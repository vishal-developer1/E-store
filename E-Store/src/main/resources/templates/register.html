
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Create Account - VP Store</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-white">

    <!-- Header -->
    <nav class="navbar navbar-dark bg-dark py-3">
        <div class="container justify-content-center">
            <a class="navbar-brand fw-bold fs-3" th:href="@{/}">
                E-<span class="text-warning">Store</span>
            </a>
        </div>
    </nav>

    <!-- Registration Section -->
    <div class="container my-5">

        <div class="row justify-content-center">

            <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">

                <div class="card border rounded-3 shadow-sm">

                    <div class="card-body p-4">

                        <h2 class="fw-normal mb-4">Create account</h2>

                        <!-- Error Message -->
                        <div th:if="${error}"
                             class="alert alert-danger"
                             role="alert"
                             th:text="${error}">
                        </div>

                        <form th:action="@{/register}" method="post">

                            <!-- Full Name -->
                            <div class="mb-3">
                                <label class="form-label fw-semibold">
                                    Your name
                                </label>

                                <input type="text"
                                       name="name"
                                       class="form-control"
                                       placeholder="First and last name"
                                       autocomplete="name"
                                       required>
                            </div>

                            <!-- Email -->
                            <div class="mb-3">
                                <label class="form-label fw-semibold">
                                    Email
                                </label>

                                <input type="email"
                                       name="email"
                                       class="form-control"
                                       placeholder="Enter your email"
                                       autocomplete="email"
                                       required>
                            </div>

                            <!-- Password -->
                            <div class="mb-3">
                                <label class="form-label fw-semibold">
                                    Password
                                </label>

                                <input type="password"
                                       name="password"
                                       class="form-control"
                                       placeholder="At least 8 characters"
                                       minlength="8"
                                       autocomplete="new-password"
                                       required>

                                <div class="form-text">
                                    Password must be at least 8 characters long.
                                </div>
                            </div>

                            <!-- Register Button -->
                            <button type="submit"
                                    class="btn btn-warning w-100 rounded-pill fw-semibold">
                                Create your account
                            </button>

                        </form>

                       

                        <hr class="my-4">

                        <div class="small">
                            <span>Already have an account?</span>
                            <a th:href="@{/login}"
                               class="text-decoration-none fw-semibold">
                                Sign in
                            </a>
                        </div>

                    </div>
                </div>

                <!-- Footer -->
                <div class="text-center mt-4">

                    <p class="text-secondary small mt-3">
                        © 2026 E- Store. All rights reserved.
                    </p>
                </div>

            </div>

        </div>

    </div>

</body>
</html>
